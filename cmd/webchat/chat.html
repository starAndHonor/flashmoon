<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flashmoon — Qwen3-0.6B on WebGPU</title>
<style>
  body { font: 14px/1.55 system-ui, sans-serif; max-width: 840px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.2rem; }
  #status { color: #666; margin: .5rem 0; font-family: ui-monospace, monospace; font-size: 12px; }
  #log { white-space: pre-wrap; border: 1px solid #ccc; border-radius: 6px; padding: 1rem; height: 60vh; overflow-y: auto; }
  #log div { margin: .25rem 0; }
  #cfg { display: flex; gap: .75rem; align-items: center; margin-top: .5rem; font-size: 12px; color: #555; }
  #cfg input { width: 4.5rem; padding: .2rem; }
  #cfg label { display: flex; gap: .3rem; align-items: center; }
  #cfg input[type=range] { width: 8rem; padding: 0; }
  #cfg output { min-width: 2.5rem; font-family: ui-monospace, monospace; }
  #bar { display: flex; gap: .5rem; margin-top: .75rem; }
  #in { flex: 1; padding: .5rem; }
</style>
<h1>flashmoon — Qwen3-0.6B chat (WebGPU, MoonBit)</h1>
<div id="status">booting…</div>
<div id="log"></div>
<div id="bar">
  <input id="in" disabled placeholder="Ask something… (Enter to send)">
  <button id="send" disabled>Send</button>
</div>
<div id="cfg">
  <label>max <input id="cfg_max" type="range" min="16" max="1800" step="16" value="256"><output for="cfg_max">256</output></label>
  <label>temp <input id="cfg_temp" type="range" min="0" max="2" step="0.05" value="0"><output for="cfg_temp">0</output></label>
  <label>top-k <input id="cfg_topk" type="range" min="0" max="200" step="1" value="1"><output for="cfg_topk">1</output></label>
  <label>top-p <input id="cfg_topp" type="range" min="0" max="1" step="0.01" value="1"><output for="cfg_topp">1</output></label>
  <span style="color:#888">temp 0 = greedy</span>
</div>
<script>
  // live value labels next to each slider
  for (const o of document.querySelectorAll('#cfg output')) {
    const inp = document.getElementById(o.htmlFor);
    inp.oninput = () => { o.textContent = inp.value; };
  }
</script>
<script src="../../_build/js/debug/build/cmd/webchat/webchat.js"></script>
